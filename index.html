.map:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px #ffdf9a55,inset 0 -30px 45px #234b1c22;pointer-events:none;z-index:1}
.location{position:absolute;z-index:2;transform:translate(-50%,-50%);border:0;background:transparent;color:white;cursor:pointer;text-align:center;padding:0;filter:drop-shadow(0 3px 2px #2a281c)}
.location .tag{display:block;background:linear-gradient(#b86e2d,#784019);border:2px solid #f8d28a;border-radius:8px;padding:clamp(4px,.7vw,9px) clamp(7px,1.1vw,14px);font:900 clamp(9px,1.15vw,15px)/1.1 system-ui,sans-serif;white-space:nowrap;box-shadow:inset 0 1px #fff8a8,0 3px 0 #4e2b16,0 0 0 2px #6b3b1e;transition:transform .2s,filter .2s}
.location .subtag{display:block;margin-top:4px;background:#fff2d9;color:#56351b;border:1px solid #9b632b;border-radius:5px;padding:3px 6px;font:700 clamp(8px,.85vw,11px)/1.1 system-ui,sans-serif;white-space:nowrap}
.location:hover,.location:focus-visible{z-index:4;filter:drop-shadow(0 0 8px #fff59b);outline:none}
.location:hover .tag,.location:focus-visible .tag{transform:translateY(-4px) scale(1.06);background:linear-gradient(#df963f,#98521c)}
.location:active .tag{transform:scale(.96)}
/* Hotspots follow the five landmarks in the supplied voxel village map. */
#opah{left:22%;top:38%}
#ehsan{left:51%;top:29%}
#meimei{left:70%;top:47%}
#muthu{left:23%;top:83%}
#taman{left:76%;top:83%}
.instruction{display:flex;justify-content:center;align-items:center;gap:9px;margin:17px auto 0;color:#24502b;text-align:center;font:700 clamp(11px,1.3vw,15px)/1.4 system-ui,sans-serif}
.pulse{width:10px;height:10px;border-radius:50%;background:#ffb72d;box-shadow:0 0 0 0 #ffb72d88;animation:pulse 1.7s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 11px #ffb72d00}100%{box-shadow:0 0 0 0 #ffb72d00}}
/* Modal */
.overlay{position:fixed;inset:0;background:#102b18b8;display:none;align-items:center;justify-content:center;padding:18px;z-index:10;backdrop-filter:blur(5px)}
.overlay.open{display:flex;animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dialog{position:relative;width:min(520px,94vw);padding:clamp(23px,4vw,38px);border:4px solid #e9bd69;border-radius:18px;background:linear-gradient(145deg,#fff3d2,#e7c58a);color:#4b2c14;box-shadow:0 0 0 5px #75431c,0 18px 55px #071b0c99;text-align:center}
.dialog:before{content:"";position:absolute;inset:7px;border:1px dashed #9b642b;border-radius:10px;pointer-events:none}
.stamp{font-size:clamp(30px,5vw,45px);margin-bottom:5px;filter:drop-shadow(0 3px 1px #a66b2c)}
.dialog h2{font-size:clamp(21px,3vw,30px);margin:4px 0 10px;color:#754019;text-shadow:0 1px #fff}
.dialog p{font:600 clamp(14px,1.6vw,17px)/1.65 system-ui,sans-serif;margin:0 auto 20px;max-width:410px}
.close{position:relative;z-index:1;border:2px solid #f8d58b;border-radius:999px;background:linear-gradient(#a45e25,#713b17);color:#fff5dc;padding:11px 25px;font:800 12px system-ui,sans-serif;letter-spacing:.08em;cursor:pointer;box-shadow:0 3px 0 #4a2812}
.close:hover{filter:brightness(1.15);transform:translateY(-1px)}
@media(max-width:560px){
 body{padding:8px}
 .topbar{margin-bottom:9px}
 .map{border-width:4px;border-radius:10px}
 .location .tag{font-size:7px;padding:3px 4px;border-width:1px;border-radius:4px}
 .location .subtag{font-size:6px;padding:2px 3px;margin-top:2px}
 .instruction{margin-top:12px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

    </button>
    <button class="location" id="ehsan" data-place="ehsan" aria-label="Rumah Ehsan">
      <span class="tag">⌂ RUMAH EHSAN</span><span class="subtag">Jom Dengar Cikgu Baca!</span>
    </button>
    <button class="location" id="meimei" data-place="meimei" aria-label="Rumah Meimei">
      <span class="tag">⌂ RUMAH MEIMEI</span><span class="subtag">Giliran Kamu Pula!</span>
    </button>
    <button class="location" id="muthu" data-place="muthu" aria-label="Gerai Uncle Muthu">
      <span class="tag">▣ GERAI UNCLE MUTHU</span><span class="subtag">Apa Yang Kamu Faham?</span>
    </button>
    <button class="location" id="taman" data-place="taman" aria-label="Taman Permainan">
      <span class="tag">⚑ TAMAN PERMAINAN</span><span class="subtag">Mari Bermain</span>
    </button>
  </section>
  <p class="instruction"><span class="pulse"></span> Tekan papan nama lokasi untuk melihat aktiviti pembelajaran.</p>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <div class="dialog">
    <div class="stamp" id="dialogIcon">🏡</div>
    <h2 id="dialogTitle">Rumah Opah</h2>
    <p id="dialogText">Ayuh Kenali Warisan Kita!</p>
    <button class="close" id="closeDialog">KEMBALI KE PETA</button>
  </div>
</div>
<script>
(() => {
 const info = {
  opah:{title:"Rumah Opah",text:"Ayuh Kenali Warisan Kita!",icon:"🏡"},
  ehsan:{title:"Rumah Ehsan",text:"Jom Dengar Cikgu Baca!",icon:"🏠"},
  meimei:{title:"Rumah Meimei",text:"Giliran Kamu Pula!",icon:"🏡"},
  muthu:{title:"Gerai Uncle Muthu",text:"Apa Yang Kamu Faham?",icon:"🍜"},
  taman:{title:"Taman Permainan",text:"Mari Bermain",icon:"🛝"}
 };
 const overlay=document.getElementById("overlay");
 const title=document.getElementById("dialogTitle");
 const text=document.getElementById("dialogText");
 const icon=document.getElementById("dialogIcon");
 document.querySelectorAll(".location").forEach(btn=>{
  btn.addEventListener("click",()=>{
   const item=info[btn.dataset.place];
   title.textContent=item.title;
   text.textContent=item.text;
   icon.textContent=item.icon;
   overlay.classList.add("open");
   document.getElementById("closeDialog").focus();
  });
 });
 function close(){overlay.classList.remove("open")}
 document.getElementById("closeDialog").addEventListener("click",close);
 overlay.addEventListener("click",e=>{if(e.target===overlay)close()});
 document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
})();
</script>
</body>
</html>
